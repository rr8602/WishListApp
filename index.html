<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위시리스트 공유</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            margin: 10px;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button.secondary {
            background: #f5f5f5;
            color: #333;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎁</div>
        <h1>위시리스트 공유</h1>
        <p class="subtitle">위시리스트를 확인하고 선물 완료 표시를 해보세요!</p>

        <div id="status" class="status loading">
            <div class="spinner"></div>
            앱을 여는 중...
        </div>

        <div id="actions" style="display: none;">
            <a href="#" id="openApp" class="button">앱 열기</a>
            <a href="https://play.google.com/store/apps/details?id=com.wishlist.app" class="button secondary">Play Store에서 다운로드</a>
        </div>

        <div class="footer">
            위시리스트 앱 © 2024
        </div>
    </div>

    <script>
        // URL에서 userId 파라미터 추출
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').innerHTML = '❌ 잘못된 공유 링크입니다';
        } else {
            // Custom URL Scheme으로 앱 열기 시도
            const appUrl = `wishlistapp://shared?userId=${userId}`;
            const statusEl = document.getElementById('status');
            const actionsEl = document.getElementById('actions');

            // 앱 열기 버튼에 URL 설정
            document.getElementById('openApp').href = appUrl;

            // 페이지 로드 시 자동으로 앱 열기 시도
            let appOpened = false;

            // iOS/Android에서 앱이 열리면 페이지가 백그라운드로 감
            window.addEventListener('blur', function() {
                appOpened = true;
                statusEl.className = 'status success';
                statusEl.innerHTML = '✅ 앱이 열렸습니다!';
            });

            // 앱 열기 시도
            setTimeout(() => {
                window.location.href = appUrl;
            }, 500);

            // 2.5초 후에도 앱이 안 열렸으면 설치 안내
            setTimeout(() => {
                if (!appOpened) {
                    statusEl.className = 'status error';
                    statusEl.innerHTML = '⚠️ 앱이 설치되지 않았거나 열 수 없습니다';
                    actionsEl.style.display = 'block';
                }
            }, 2500);
        }
    </script>
</body>
</html>
